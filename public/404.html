<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found — SnapSME</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="The page you requested could not be found." />
  
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="bg-[#f6f5f4] text-[#000000] font-body min-h-screen antialiased flex flex-col justify-between">

  <!-- Shared Reusable Header Container -->
  <div id="snapsme-header"></div>

  <!-- Main 404 Container -->
  <div class="document-container" style="padding-top: 60px; padding-bottom: 60px; text-align: center;">
    
    <!-- Torn Receipt Card treatment -->
    <div class="notion-card-white torn-receipt-card" style="max-width: 480px; margin: 0 auto; padding: 40px 32px;">
      
      <div style="width: 56px; height: 56px; border-radius: 50%; background-color: #fdf2f0; color: var(--color-vermillion); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>

      <span class="pill-tag pill-tag-blue" style="margin-bottom: 12px; font-size: 13px; font-weight: 600;">ERROR 404</span>

      <h1 style="font-family: var(--font-notioninter); font-weight: 700; font-size: 26px; color: var(--color-ink-black); margin: 8px 0 12px 0; letter-spacing: -0.5px;">
        Page not found
      </h1>

      <p style="font-family: var(--font-notioninter); font-size: 15px; color: var(--color-graphite); margin: 0 0 28px 0; line-height: 1.6;">
        The page you are looking for doesn't exist, has been moved, or the link may be broken.
      </p>

      <a href="/home" class="btn-notion-primary" style="padding: 10px 22px; font-size: 15px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>

    </div>

  </div>

  <!-- Shared Reusable Footer Container -->
  <div id="snapsme-footer"></div>

  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/footer.js"></script>

</body>
</html>
