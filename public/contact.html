<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — SnapSME</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Contact SnapSME support for assistance with team expense tracking." />
  
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="bg-[#f6f5f4] text-[#000000] font-body min-h-screen antialiased">

  <!-- Shared Reusable Nav Header -->
  <div id="snapsme-header"></div>

  <!-- Document Container -->
  <div class="document-container">
    <!-- Back to Home Link -->
    <a href="/home" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to home</span>
    </a>

    <!-- Title & Intro -->
    <h1 class="document-title">Contact Us</h1>
    <p class="document-meta">Have a question or need assistance? Send us a message and our team will get back to you shortly.</p>

    <!-- Contact Container (Form or Success Torn Card) -->
    <div id="contact-card-container">
      <div class="contact-card torn-receipt-card">
        
        <!-- Error Banner -->
        <div id="contact-form-error" class="form-error"></div>

        <!-- Contact Form -->
        <form id="snapsme-contact-form" class="contact-form" novalidate>
          <div class="form-group">
            <label for="contact-name" class="form-label">Your Name <span style="color: var(--color-vermillion);">*</span></label>
            <input
              type="text"
              id="contact-name"
              name="name"
              class="form-input"
              placeholder="e.g. Sarah Jenkins"
              required
            />
          </div>

          <div class="form-group">
            <label for="contact-email" class="form-label">Email Address <span style="color: var(--color-vermillion);">*</span></label>
            <input
              type="email"
              id="contact-email"
              name="email"
              class="form-input"
              placeholder="e.g. sarah@acmetrading.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="contact-message" class="form-label">Message <span style="color: var(--color-vermillion);">*</span></label>
            <textarea
              id="contact-message"
              name="message"
              class="form-textarea"
              placeholder="How can we help your team?"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-notion-primary" style="padding: 12px 24px; font-size: 15px; margin-top: 4px;">
            <span>Send Message</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>

      </div>
    </div>
  </div>

  <!-- Reusable Header & Footer -->
  <div id="snapsme-footer"></div>
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/contact.js"></script>
  <script type="module" src="/js/footer.js"></script>

</body>
</html>
